name: Home checks
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Windows BAT first launch
        if: runner.os == 'Windows'
        shell: cmd
        run: Start.bat --check
      - name: Linux first launch
        if: runner.os == 'Linux'
        run: python launcher.py --check
      - run: npm test
      - run: node tests/geometry.mjs
      - run: node tests/flow.mjs
      - run: node tests/chat_virtual.mjs
      - run: python -m py_compile server.py launcher.py design_store.py chat_store.py cloud_client.py workspace.py routing.py tool_engine.py advanced_tools.py agent_engine.py report_export.py work_import.py evidence.py web_research.py knowledge_store.py cognitive_tools.py chat_intelligence.py workspace_intelligence.py
      - run: python tests/smoke.py
      - run: python tests/chat_smoke.py
      - run: python tests/memory_health.py
      - run: python tests/block_cloud.py
      - run: python tests/workspace_smoke.py
      - run: python tests/routing_smoke.py
      - run: python tests/tool_engine_smoke.py
      - run: python tests/advanced_tools_smoke.py
      - run: python tests/agent_engine_smoke.py
      - run: python tests/report_export_smoke.py
      - run: python tests/stream_smoke.py
      - run: python tests/work_import_smoke.py
      - run: python tests/evidence_smoke.py
      - run: python tests/web_research_smoke.py
      - run: python tests/knowledge_smoke.py
      - run: python tests/cognitive_tools_smoke.py
      - run: python tests/chat_intelligence_smoke.py
      - run: python tests/chat_evolution_smoke.py
      - run: python tests/revolution_automation_smoke.py
      - run: python tests/revolution_analysis_smoke.py
      - run: python tests/global_concurrency_smoke.py
      - run: python tests/global_memory_smoke.py
      - run: python tests/global_workspace_smoke.py
      - run: python tests/global_ui_contract.py
      - run: python tests/global_reasoning_smoke.py
      - name: Upload startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-log-${{ matrix.os }}
          path: logs/startup.log
